name: Validate PLS

on:
  push:
    paths:
      - 'pls.yaml'
      - 'pls-review.yaml'
      - '**/*.md'
      - '.github/workflows/validate-pls.yml'
  pull_request:
    paths:
      - 'pls.yaml'
      - 'pls-review.yaml'
      - '**/*.md'
      - '.github/workflows/validate-pls.yml'

jobs:
  validate-pls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out PLS specification
        uses: actions/checkout@v4
        with:
          repository: Ploos-AS/learning-standard
          ref: main
          path: .pls-standard

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install validator dependencies
        run: python -m pip install --upgrade pip pyyaml jsonschema

      - name: Validate PLS metadata and review evidence
        shell: bash
        run: |
          args=(pls.yaml --schema .pls-standard/schema/pls.schema.json --review-schema .pls-standard/schema/pls-review.schema.json)
          if [[ -f pls-review.yaml ]]; then
            args+=(--review pls-review.yaml)
          fi
          python .pls-standard/tools/pls_lint.py "${args[@]}"

      - name: Check review freshness
        if: hashFiles('pls-review.yaml') != ''
        run: python .pls-standard/tools/pls_staleness.py pls.yaml pls-review.yaml --repo-root .
