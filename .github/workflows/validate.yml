name: Validate PLS

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2 jsonschema==4.23.0

      - name: Compile tooling
        run: python -m py_compile tools/pls_lint.py tools/pls_staleness.py

      - name: Validate example metadata
        run: python tools/pls_lint.py examples/pls.yaml

      - name: Validate review evidence template
        run: python tools/pls_lint.py examples/pls.yaml --review templates/pls-review.yaml

      - name: Verify staleness tool skips non-reviewed example
        run: python tools/pls_staleness.py examples/pls.yaml templates/pls-review.yaml --repo-root .
