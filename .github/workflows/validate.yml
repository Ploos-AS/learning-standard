name: Validate PLS

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2 jsonschema==4.23.0

      - name: Compile tooling and tests
        run: python -m py_compile tools/pls_lint.py tools/pls_staleness.py tests/test_pls_state_machine.py

      - name: Validate example metadata
        run: python tools/pls_lint.py examples/pls.yaml

      - name: Validate review evidence template
        run: python tools/pls_lint.py examples/pls.yaml --review templates/pls-review.yaml

      - name: Validate attestation template schema
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml
          from jsonschema import Draft202012Validator, FormatChecker

          schema = json.loads(Path('schema/pls-attestation.schema.json').read_text())
          data = yaml.safe_load(Path('templates/pls-attestation.yaml').read_text())
          errors = list(Draft202012Validator(schema, format_checker=FormatChecker()).iter_errors(data))
          if errors:
              raise SystemExit('\n'.join(error.message for error in errors))
          print('PLS attestation template: OK')
          PY

      - name: Verify staleness tool skips non-reviewed example
        run: python tools/pls_staleness.py examples/pls.yaml templates/pls-review.yaml --repo-root . --attestation-schema schema/pls-attestation.schema.json

      - name: Run PLS state machine tests
        run: python -m unittest -v tests/test_pls_state_machine.py
